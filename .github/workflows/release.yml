name: Release Windows installer

on:
  release:
    types: [published]
  # Publicar a release empurrando a tag: o proprio workflow cria a release,
  # gera o instalador e publica os assets (exe, blockmap e latest.yml).
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release no formato vX.Y.Z"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  # O CRA trata avisos do ESLint como erro quando CI=true. O projeto possui
  # avisos legados; um aviso de estilo não deve impedir a geração do instalador.
  # A validação de tipos continua obrigatória no passo "Verificar TypeScript".
  CI: "false"

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Validar tag da release
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) {
            throw "Tag da release não informada."
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "A tag deve seguir o formato vX.Y.Z (recebida: $env:RELEASE_TAG)."
          }
          Write-Host "Tag da release: $env:RELEASE_TAG"

      - name: Checkout da tag exata
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Confirmar commit da tag
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          if ($head -ne $tagCommit) {
            throw "O checkout ($head) não corresponde ao commit da tag $env:RELEASE_TAG ($tagCommit)."
          }
          Write-Host "Commit validado: $head"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validar versão da tag x package.json
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $($package.version) do package.json (esperado: $expected)."
          }
          Write-Host "Versão validada: $($package.version)"

      - name: Preparar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release pode ja existir (fluxo manual) ou ser criada agora
          # (disparo por tag). A API do GitHub e usada para nao depender do
          # comportamento da CLI `gh` (que aborta o script quando a release
          # ainda nao existe).
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "konexus-release-workflow"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $diag = New-Object System.Collections.Generic.List[string]
          $diag.Add("repo=$env:GITHUB_REPOSITORY tag=$env:RELEASE_TAG token_len=$($env:GH_TOKEN.Length)")

          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "$api/tags/$env:RELEASE_TAG" -Headers $headers -Method Get -ErrorAction Stop
            $diag.Add("release ja existe: $($existing.tag_name) draft=$($existing.draft)")
          } catch {
            $diag.Add("GET release falhou (esperado quando ainda nao existe): $($_.Exception.Message)")
          }

          if (-not $existing) {
            $versao = $env:RELEASE_TAG.Substring(1)
            $notas = "Konexus $versao. Inclui o modulo de Contabilidade (adicional contratado do Financeiro), a aba de auditoria no painel administrativo global e o fluxo de reautenticacao por senha. Atualizacao automatica: baixe o instalador Konexus-Setup-$versao.exe ou deixe o aplicativo instalado buscar a nova versao sozinho."
            $body = @{
              tag_name = $env:RELEASE_TAG
              name = "Konexus $versao"
              body = $notas
              draft = $false
              prerelease = $false
              target_commitish = "main"
            } | ConvertTo-Json

            try {
              $created = Invoke-RestMethod -Uri $api -Headers $headers -Method Post -Body $body -ContentType "application/json" -ErrorAction Stop
              $diag.Add("release criada e publicada: $($created.html_url)")
            } catch {
              $diag.Add("POST release falhou: $($_.Exception.Message)")
              if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
                $diag.Add("detalhe: $($_.ErrorDetails.Message)")
              }
              # publica o diagnostico em uma issue (o log do runner exige credencial)
              $issue = @{
                title = "[release-debug] $env:RELEASE_TAG"
                body = ($diag -join [Environment]::NewLine)
              } | ConvertTo-Json
              try {
                Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Headers $headers -Method Post -Body $issue -ContentType "application/json" -ErrorAction Stop | Out-Null
              } catch {
                # sem diagnostico publicado, o erro original segue abaixo
              }
              throw ($diag -join [Environment]::NewLine)
            }
          }

          Write-Host ($diag -join [Environment]::NewLine)

      - name: Instalar dependências (lockfile)
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Testar seleção do instalador de atualização
        run: npm run test:update

      - name: Auditar fluxo de atualização (sem rede)
        run: node scripts/audit-update-flow.mjs --skip-network

      - name: Testar estados da tela de atualização
        env:
          CI: "true"
        run: npm run test:frontend

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Gerar instalador Windows
        run: npm run electron:build -- --win nsis --publish never

      - name: Validar artefatos obrigatórios
        run: node scripts/verify-release-artifacts.mjs --version "${{ env.RELEASE_TAG }}" --dist dist

      - name: Publicar assets na release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestPath = Join-Path (Get-Location) "dist/release-assets.json"
          if (-not (Test-Path $manifestPath)) {
            throw "Manifesto de assets não encontrado: $manifestPath"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $assets = @()
          foreach ($file in $manifest.files) {
            $assetPath = Join-Path (Get-Location) "dist/$file"
            if (-not (Test-Path $assetPath)) {
              throw "Asset não encontrado: $assetPath"
            }
            $assets += $assetPath
          }

          if ($assets.Count -ne 3) {
            throw "Esperados 3 assets (.exe, .exe.blockmap e latest.yml); encontrados $($assets.Count)."
          }

          gh release view $env:RELEASE_TAG --json tagName | Out-Null
          gh release upload $env:RELEASE_TAG $assets --clobber
          Write-Host "Upload concluído para a release $env:RELEASE_TAG."

      - name: Confirmar assets publicados
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestPath = Join-Path (Get-Location) "dist/release-assets.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $published = @($release.assets | ForEach-Object { $_.name })

          foreach ($file in $manifest.files) {
            $asset = $release.assets | Where-Object { $_.name -eq $file } | Select-Object -First 1
            if (-not $asset) {
              throw "Asset ausente na release: $file"
            }

            $localPath = Join-Path (Get-Location) "dist/$file"
            $localSize = (Get-Item $localPath).Length
            if ($asset.size -ne $localSize) {
              throw "Tamanho divergente para $file (local: $localSize, publicado: $($asset.size))."
            }

            Write-Host "Asset publicado: $file ($localSize bytes)"
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP "release-verify"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $env:RELEASE_TAG --pattern latest.yml --dir $downloadDir --clobber

          $downloadedLatest = Get-Content (Join-Path $downloadDir "latest.yml") -Raw
          if ($downloadedLatest -notmatch "(?m)^version:\s*$($manifest.version)\s*$") {
            throw "O latest.yml publicado não declara a versão $($manifest.version)."
          }

          Write-Host "latest.yml publicado e validado (versão $($manifest.version))."

